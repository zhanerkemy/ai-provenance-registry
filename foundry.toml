[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pin the compiler so everyone, and the grader, builds the exact same bytecode.
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# Gas numbers in the paper come from:  forge test --gas-report
gas_reports = ["*"]  # every contract: ModelRegistry, EventRegistry, MerkleRegistry

[fuzz]
runs = 256
# Fixed seed so fuzz tests use the same random inputs on every machine (Stage 4: fix seeds).
seed = "0x435"

# Used by the GitHub Actions workflow in .github/workflows/test.yml
[profile.ci]
fuzz = { runs = 1000 }